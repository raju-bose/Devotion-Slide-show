<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0612">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Divine Darshan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#ffd76a;
    --gold-soft:#fff1c1;
    --ui-bg:rgba(15,8,25,.72);
    --ui-border:rgba(255,215,106,.35);
    --dur:1.3s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;color:#fff;
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body.hide-cursor{cursor:none}

  /* ---------- Stage & slides ---------- */
  #stage{position:fixed;inset:0;perspective:1700px;overflow:hidden;background:#000}
  body.mirror #stage{transform:scaleX(-1)}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2vh;padding:3vh 4vw 9vh;opacity:0;backface-visibility:hidden;transform-style:preserve-3d;
    transition:transform var(--dur) cubic-bezier(.65,.05,.3,1),opacity var(--dur) ease}
  .slide.active{opacity:1;transform:none;z-index:2}
  .slide.from-right{transform:translateX(60%) rotateY(-80deg) scale(.85)}
  .slide.from-left {transform:translateX(-60%) rotateY(80deg) scale(.85)}
  .slide.to-left   {opacity:0;transform:translateX(-60%) rotateY(80deg) scale(.85);z-index:1}
  .slide.to-right  {opacity:0;transform:translateX(60%) rotateY(-80deg) scale(.85);z-index:1}

  .visual{height:60vh;aspect-ratio:1/1;max-width:92vw;display:flex;align-items:center;justify-content:center;position:relative}
  .visual svg{width:100%;height:100%;filter:drop-shadow(0 0 3vh rgba(255,200,90,.45))}
  .photo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
  .photo::before{content:"";position:absolute;inset:4%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,220,130,.55),rgba(255,160,40,.12) 55%,transparent 70%);
    animation:pulse 6s ease-in-out infinite}
  .photo img{position:relative;max-width:100%;max-height:100%;object-fit:contain;border-radius:1.2vh;
    box-shadow:0 0 0 .35vh rgba(255,215,106,.8),0 0 6vh rgba(255,190,80,.55)}
  @keyframes pulse{0%,100%{transform:scale(.96);opacity:.8}50%{transform:scale(1.04);opacity:1}}

  .text{text-align:center;max-width:92vw}
  .name{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(20px,4.4vh,54px);letter-spacing:.08em;
    color:var(--gold-soft);text-shadow:0 0 2vh rgba(255,200,90,.6)}
  .name .hi{font-family:"Tiro Devanagari Sanskrit","Nirmala UI",Mangal,serif;letter-spacing:0;font-weight:400;
    color:var(--gold);margin-left:.4em}
  .mantra{margin-top:1.2vh;font-family:"Tiro Devanagari Sanskrit","Nirmala UI",Mangal,serif;
    font-size:clamp(22px,5.2vh,64px);line-height:1.35;color:#fff;
    text-shadow:0 0 1vh rgba(255,170,60,.9),0 0 3vh rgba(255,120,30,.6)}
  .mantra.long{font-size:clamp(18px,3.6vh,44px)}
  .tr{margin-top:.8vh;font-size:clamp(13px,2.4vh,28px);font-style:italic;color:rgba(255,235,190,.85);letter-spacing:.03em}

  /* SVG animation */
  .spin{transform-box:view-box;transform-origin:200px 190px;animation:spin 90s linear infinite}
  .spin-rev{transform-box:view-box;transform-origin:200px 190px;animation:spin 140s linear infinite reverse}
  .glow{transform-box:view-box;transform-origin:200px 190px;animation:pulse 5s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Progress & dots ---------- */
  #progress{position:fixed;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,#ff9d2e,var(--gold));z-index:20}
  #dots{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;z-index:20;
    transition:opacity .4s}
  #dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28)}
  #dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}

  /* ---------- Controls ---------- */
  #controls{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:30;display:flex;flex-wrap:wrap;
    justify-content:center;align-items:center;gap:8px;padding:10px 14px;max-width:96vw;background:var(--ui-bg);
    border:1px solid var(--ui-border);border-radius:14px;backdrop-filter:blur(8px);transition:opacity .4s,transform .4s}
  body.idle #controls,body.idle #dots{opacity:0;pointer-events:none}
  body.idle #controls{transform:translate(-50%,20px)}
  #controls button,#controls select,#controls label.btn{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px 12px;cursor:pointer;min-height:38px;
    display:inline-flex;align-items:center;gap:6px}
  #controls button:hover,#controls label.btn:hover{background:rgba(255,215,106,.18);border-color:var(--gold)}
  #controls button.on{background:rgba(255,215,106,.28);border-color:var(--gold);color:var(--gold-soft)}
  #controls select option{background:#1a0f26}
  #file{display:none}
  #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:40;background:var(--ui-bg);
    border:1px solid var(--ui-border);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none}
  #toast.show{opacity:1}

  @media (orientation:portrait){
    .visual{height:auto;width:88vw}
    .slide{padding-bottom:16vh}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="progress"></div>
<div id="dots"></div>

<div id="controls">
  <button id="bPrev" title="Previous (←)">⏮</button>
  <button id="bPlay" title="Play / Pause (Space)">⏸ Pause</button>
  <button id="bNext" title="Next (→)">⏭</button>
  <select id="sTime" title="Time per deity">
    <option value="6">6 sec</option>
    <option value="10" selected>10 sec</option>
    <option value="15">15 sec</option>
    <option value="20">20 sec</option>
    <option value="30">30 sec</option>
    <option value="60">1 min</option>
  </select>
  <select id="sFx" title="Rotation effect">
    <option value="rtl" selected>Rotate Right → Left</option>
    <option value="ltr">Rotate Left → Right</option>
    <option value="swing">Swing Left ↔ Right</option>
  </select>
  <button id="bChant" title="Speak the mantra aloud">🔔 Chant</button>
  <button id="bMirror" title="Flip image for rear projection (M)">⇋ Mirror</button>
  <label class="btn" for="file" title="Use your own clear photos">🖼 My Photos</label>
  <input type="file" id="file" accept="image/*" multiple>
  <button id="bFull" title="Full screen (F)">⛶ Full screen</button>
</div>
<div id="toast"></div>

<script>
/* =========================================================
   DEITY LIST — add more by copying one line.
   icon: trishul | chakra | lotus | sun | gada | flute | vina |
         sword | vel | bow | eclipse | comet | crescent | text
   ========================================================= */
const DEITIES = [

 {key:['lakshmi','laxmi','mahalaxmi','mahalakshmi'], name:'Maa Mahalaxmi', hi:'माँ महालक्ष्मी',
  mantra:'ॐ श्रीं ह्रीं श्रीं कमले कमलालये प्रसीद प्रसीद श्रीं ह्रीं श्रीं ॐ महालक्ष्म्यै नमः',
  tr:'Om Shreem Hreem Shreem Kamale Kamalalaye Praseed Praseed Shreem Hreem Shreem Om Mahalakshmyai Namah',
  c1:'#d9366f', c2:'#3a0616', icon:'lotus'},
 {key:['narasimha','narasingha','narsingh','nrisimha','narsimha'], name:'Lord Narasimha', hi:'भगवान नृसिंह',
  mantra:'ॐ उग्रं वीरं महाविष्णुं ज्वलन्तं सर्वतोमुखम्। नृसिंहं भीषणं भद्रं मृत्युमृत्युं नमाम्यहम्॥',
  tr:'Om Ugram Veeram Mahavishnum Jvalantam Sarvatomukham, Nrisimham Bhishanam Bhadram Mrityumrityum Namamyaham',
  c1:'#e0461b', c2:'#2a0500', icon:'text', glyph:'क्ष्रौं'},
 {key:['durga','ambe','bhavani'], name:'Maa Durga', hi:'माँ दुर्गा',
  mantra:'ॐ दुं दुर्गायै नमः', tr:'Om Dum Durgayai Namah', c1:'#d11f2a', c2:'#300408', icon:'text', glyph:'दुं'},

  mantra:'ॐ स्रां स्रीं स्रौं सः केतवे नमः', tr:'Om Sraam Sreem Sraum Sah Ketave Namah', c1:'#6d4c41', c2:'#0d0604', icon:'comet'},

  mantra:'ॐ नमो भगवते वासुदेवाय', tr:'Om Namo Bhagavate Vasudevaya', c1:'#1e62c9', c2:'#04143a', icon:'flute'},

  mantra:'ॐ नमो नारायणाय', tr:'Om Namo Narayanaya', c1:'#1976d2', c2:'#03152e', icon:'chakra'},
 {key:['rama','ram','shriram','raghav'], name:'Lord Rama', hi:'भगवान श्रीराम',
  mantra:'श्री राम जय राम जय जय राम', tr:'Shri Ram Jai Ram Jai Jai Ram', c1:'#2e7d32', c2:'#031a06', icon:'bow'},
 {key:['jagannath','jagganath','jagannatha'], name:'Lord Jagannath', hi:'भगवान जगन्नाथ',
  mantra:'ॐ श्री जगन्नाथाय नमः', tr:'Om Shri Jagannathaya Namah', c1:'#b71c1c', c2:'#1a0303', icon:'chakra'},
 {key:['shani','shanidev','shanidev'], name:'Lord Shani', hi:'शनि देव',
  mantra:'ॐ प्रां प्रीं प्रौं सः शनैश्चराय नमः', tr:'Om Praam Preem Praum Sah Shanaischaraya Namah', c1:'#283593', c2:'#02041a', icon:'text', glyph:'शं'},
 {key:['chandra','moon','som'], name:'Lord Chandra', hi:'चन्द्र देव',
  mantra:'ॐ श्रां श्रीं श्रौं सः चन्द्रमसे नमः', tr:'Om Shraam Shreem Shraum Sah Chandramase Namah', c1:'#90a4ae', c2:'#0b1320', icon:'crescent'},
 {key:['gayatri'], name:'Maa Gayatri', hi:'माँ गायत्री',
  mantra:'ॐ भूर्भुवः स्वः तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि धियो यो नः प्रचोदयात्॥',
  tr:'Om Bhur Bhuvah Svah, Tat Savitur Varenyam, Bhargo Devasya Dhimahi, Dhiyo Yo Nah Prachodayat',
  c1:'#ff8f00', c2:'#2e1200', icon:'text', glyph:'ॐ'},

/* ---------- SVG artwork ---------- */
const G = 'url(#gold)';
function ring(n, r, f){ let s=''; for(let i=0;i<n;i++){ const a=i*360/n; s+=f(a,r,i);} return s; }
const ICONS = {
  trishul:()=>`
    <g fill="none" stroke="${G}" stroke-width="9" stroke-linecap="round">
      <line x1="200" y1="112" x2="200" y2="300"/>
      <path d="M148 118 Q148 176 200 182 Q252 176 252 118"/>
    </g>
    <path d="M200 88 L213 128 L200 121 L187 128Z M148 100 L158 128 L148 122 L138 128Z M252 100 L262 128 L252 122 L242 128Z" fill="${G}"/>
    <path d="M182 208 L218 208 L200 228 Z M182 248 L218 248 L200 228 Z" fill="${G}"/>
    <path d="M178 238 Q160 230 166 218" stroke="${G}" stroke-width="3" fill="none"/>`,
  chakra:()=>`
    <g class="spin-rev">
      <circle cx="200" cy="190" r="70" fill="none" stroke="${G}" stroke-width="10"/>
      <circle cx="200" cy="190" r="16" fill="${G}"/>
      ${ring(12,0,a=>`<line x1="200" y1="190" x2="200" y2="128" stroke="${G}" stroke-width="5" transform="rotate(${a} 200 190)"/>`)}
      ${ring(24,0,a=>`<path d="M193 116 L200 96 L207 116Z" fill="${G}" transform="rotate(${a} 200 190)"/>`)}
    </g>`,
  lotus:()=>`
    ${ring(8,0,a=>`<ellipse cx="200" cy="140" rx="22" ry="52" fill="url(#pink)" stroke="#ffe3ef" stroke-width="2" transform="rotate(${a} 200 190)"/>`)}
    ${ring(8,0,a=>`<ellipse cx="200" cy="158" rx="14" ry="34" fill="#ffc1d9" opacity=".9" transform="rotate(${a+22.5} 200 190)"/>`)}
    <circle cx="200" cy="190" r="20" fill="${G}"/>`,
  sun:()=>`
    <g class="spin">${ring(16,0,(a,r,i)=>`<path d="M190 128 L200 ${i%2?96:80} L210 128Z" fill="${G}" transform="rotate(${a} 200 190)"/>`)}</g>
    <circle cx="200" cy="190" r="56" fill="${G}"/>
    <circle cx="200" cy="190" r="56" fill="none" stroke="#fff6c8" stroke-width="3"/>`,
  gada:()=>`
    <line x1="160" y1="300" x2="222" y2="170" stroke="${G}" stroke-width="14" stroke-linecap="round"/>
    <circle cx="232" cy="142" r="40" fill="${G}"/>
    <path d="M196 134 Q232 118 268 150 M200 158 Q236 140 264 170" stroke="#a9670f" stroke-width="4" fill="none"/>
    <circle cx="246" cy="98" r="8" fill="${G}"/>
    <rect x="166" y="262" width="22" height="10" fill="#a9670f" transform="rotate(25 177 267)"/>`,
  flute:()=>`
    <line x1="112" y1="268" x2="292" y2="130" stroke="${G}" stroke-width="16" stroke-linecap="round"/>
    ${[0,1,2,3,4,5].map(i=>`<circle cx="${160+i*18}" cy="${231-i*13.8}" r="3.6" fill="#6b3d06"/>`).join('')}
    <path d="M290 60 Q330 95 296 138 Q262 95 290 60Z" fill="#1c8f7a"/>
    <ellipse cx="293" cy="100" rx="13" ry="17" fill="#1d4fa3"/>
    <ellipse cx="293" cy="102" rx="6" ry="8" fill="#0b1b3f"/>
    <line x1="293" y1="138" x2="286" y2="168" stroke="#1c8f7a" stroke-width="3"/>`,
  vina:()=>`
    <line x1="125" y1="285" x2="285" y2="100" stroke="${G}" stroke-width="10" stroke-linecap="round"/>
    <circle cx="138" cy="268" r="40" fill="${G}"/>
    <circle cx="272" cy="118" r="26" fill="${G}"/>
    ${[-4,0,4].map(o=>`<line x1="${150+o}" y1="${258+o}" x2="${280+o}" y2="${108+o}" stroke="#fff6c8" stroke-width="1"/>`).join('')}
    <path d="M285 100 Q300 80 318 86" stroke="${G}" stroke-width="6" fill="none" stroke-linecap="round"/>`,
  sword:()=>`
    <path d="M191 250 Q170 170 206 88 Q232 172 211 250Z" fill="${G}"/>
    <line x1="200" y1="110" x2="200" y2="240" stroke="#a9670f" stroke-width="2"/>
    <rect x="164" y="248" width="72" height="10" rx="5" fill="${G}"/>
    <rect x="193" y="258" width="14" height="40" rx="4" fill="#a9670f"/>
    <circle cx="200" cy="304" r="9" fill="${G}"/>`,

    <path d="M200 62 Q246 118 200 172 Q154 118 200 62Z" fill="${G}"/>
    <path d="M200 90 Q222 118 200 150 Q178 118 200 90Z" fill="#c2185b" opacity=".7"/>`,

    <path d="M160 92 Q274 190 160 288" fill="none" stroke="${G}" stroke-width="10" stroke-linecap="round"/>
    <line x1="160" y1="92" x2="160" y2="288" stroke="#fff6c8" stroke-width="2"/>
    <line x1="130" y1="190" x2="290" y2="190" stroke="${G}" stroke-width="5"/>
    <path d="M300 190 L278 178 L282 190 L278 202Z" fill="${G}"/>

  eclipse:()=>`
    <g class="spin">${ring(24,0,a=>`<path d="M195 120 L200 90 L205 120Z" fill="${G}" transform="rotate(${a} 200 190)"/>`)}</g>

    <circle cx="218" cy="178" r="62" fill="#0b0d10"/>`,

    <path d="M240 150 L110 290 L150 270 L120 300 L250 170Z" fill="url(#tail)"/>

  crescent:()=>`
    <path d="M232 104 A90 90 0 1 0 232 276 A70 70 0 1 1 232 104Z" fill="${G}"/>
    <circle cx="258" cy="140" r="4" fill="#fff"/><circle cx="276" cy="200" r="3" fill="#fff"/>`,
  text:d=>`<text x="200" y="${(d.glyph||'ॐ').length>2?222:232}" text-anchor="middle"
     font-family="'Tiro Devanagari Sanskrit','Nirmala UI',Mangal,serif"
     font-size="${(d.glyph||'ॐ').length>2?92:140}" fill="${G}" stroke="#fff6c8" stroke-width="1.5">${d.glyph||'ॐ'}</text>`
};

function artSVG(d){
  return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${d.name}">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#ffcf4a"/><stop offset="1" stop-color="#c8871a"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/>
      <stop offset=".45" stop-color="${d.c1}" stop-opacity=".9"/><stop offset="1" stop-color="${d.c1}" stop-opacity="0"/></radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3ef"/><stop offset="1" stop-color="#e2437a"/></linearGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf4a"/><stop offset="1" stop-color="#ffcf4a" stop-opacity="0"/></linearGradient>
  </defs>
  <circle class="glow" cx="200" cy="190" r="175" fill="url(#halo)"/>
  <g class="spin" opacity=".55">${ring(48,0,(a,r,i)=>`<line x1="200" y1="${i%2?40:24}" x2="200" y2="62" stroke="#ffe9a8" stroke-width="${i%2?1.2:2.2}" transform="rotate(${a} 200 190)"/>`)}</g>
  <g class="spin-rev">
    <circle cx="200" cy="190" r="152" fill="none" stroke="${G}" stroke-width="2.5"/>
    <circle cx="200" cy="190" r="162" fill="none" stroke="${G}" stroke-width="1" stroke-dasharray="4 7"/>
    ${ring(24,0,a=>`<circle cx="200" cy="38" r="4" fill="${G}" transform="rotate(${a} 200 190)"/>`)}
  </g>
  <circle cx="200" cy="190" r="112" fill="rgba(0,0,0,.25)" stroke="${G}" stroke-width="1.5"/>
  ${ICONS[d.icon] ? ICONS[d.icon](d) : ICONS.text(d)}
  <g transform="translate(0,6)">
    ${[-60,-40,-20,0,20,40,60].map(a=>`<ellipse cx="200" cy="336" rx="11" ry="28" fill="url(#gold)" opacity=".9" transform="rotate(${a} 200 360)"/>`).join('')}
    <rect x="150" y="358" width="100" height="8" rx="4" fill="url(#gold)"/>
  </g>
</svg>`;
}

/* ---------- Slideshow engine ---------- */
let slides = DEITIES.map(d=>({...d}));
let idx = 0, playing = true, timer = null, swingDir = 1, chant = false;
const stage = document.getElementById('stage');
const A = document.createElement('div'), B = document.createElement('div');
A.className = B.className = 'slide'; stage.append(A,B);
let cur = A, spare = B;
const $ = id => document.getElementById(id);

function fill(el, d){
  el.style.background = `radial-gradient(ellipse at 50% 38%, ${d.c1} 0%, ${d.c2} 55%, #000 100%)`;
  const visual = d.img ? `<div class="photo"><img src="${d.img}" alt="${d.name}"></div>` : artSVG(d);
  const long = d.mantra && d.mantra.length > 40 ? ' long' : '';
  el.innerHTML = `<div class="visual">${visual}</div>
    <div class="text">
      <div class="name">${d.name}${d.hi?`<span class="hi">${d.hi}</span>`:''}</div>
      ${d.mantra?`<div class="mantra${long}">${d.mantra}</div>`:''}
      ${d.tr?`<div class="tr">${d.tr}</div>`:''}
    </div>`;
}

function show(i, dir){
  idx = (i + slides.length) % slides.length;
  const d = slides[idx];
  spare.style.transition = 'none';
  spare.className = 'slide ' + (dir < 0 ? 'from-left' : 'from-right');
  fill(spare, d);
  void spare.offsetWidth;
  spare.style.transition = '';
  spare.className = 'slide active';
  cur.className = 'slide ' + (dir < 0 ? 'to-right' : 'to-left');
  [cur, spare] = [spare, cur];
  renderDots(); speak(d); schedule();
}

function autoDir(){
  const fx = $('sFx').value;
  if (fx === 'ltr') return -1;
  if (fx === 'swing') { swingDir = -swingDir; return swingDir; }
  return 1;
}
function next(){ show(idx + 1, autoDir()); }
function prev(){ show(idx - 1, $('sFx').value === 'ltr' ? 1 : -1); }

function schedule(){
  clearTimeout(timer);
  const p = $('progress');
  p.style.transition = 'none'; p.style.width = '0';
  if (!playing) return;
  const ms = +$('sTime').value * 1000;
  void p.offsetWidth;
  p.style.transition = `width ${ms}ms linear`; p.style.width = '100%';
  timer = setTimeout(next, ms);   // after the last deity it wraps to the first automatically
}

function renderDots(){
  $('dots').innerHTML = slides.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('');
}

function speak(d){
  if (!chant || !('speechSynthesis' in window) || !d.mantra) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(d.mantra);
  u.lang = 'hi-IN'; u.rate = .7; u.pitch = .9;
  const v = speechSynthesis.getVoices().find(v=>/hi[-_]IN/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3500); }

/* ---------- Keep screen awake while playing ---------- */
let lock = null;
async function wake(){ try{ if('wakeLock' in navigator && playing) lock = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });

/* ---------- Controls ---------- */
$('bNext').onclick = next;
$('bPrev').onclick = prev;
$('bPlay').onclick = togglePlay;
function togglePlay(){
  playing = !playing;
  $('bPlay').textContent = playing ? '⏸ Pause' : '▶ Play';
  if (playing) wake(); schedule();
}
$('sTime').onchange = schedule;
$('bChant').onclick = e => { chant = !chant; e.currentTarget.classList.toggle('on', chant);
  if (chant) speak(slides[idx]); else if ('speechSynthesis' in window) speechSynthesis.cancel(); };
$('bMirror').onclick = toggleMirror;
function toggleMirror(){ document.body.classList.toggle('mirror'); $('bMirror').classList.toggle('on'); }
$('bFull').onclick = toggleFull;
function toggleFull(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
}

/* Your own photos: name files like shiva.jpg, hanuman.png, durga.jpg …
   Matching photos replace the drawn artwork; any other photos are added as extra slides.
   Photos are only held in memory — nothing is copied or saved to disk. */
$('file').onchange = e => {
  const files = [...e.target.files]; let matched = 0, added = 0;
  files.forEach(f=>{
    const url = URL.createObjectURL(f);
    const n = f.name.toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z]/g,'');
    const d = slides.find(s => s.key && s.key.some(k => n.includes(k)));
    if (d) { d.img = url; matched++; }
    else {
      const pretty = f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      slides.push({name:pretty, img:url, c1:'#8e24aa', c2:'#14041e'}); added++;
    }
  });
  toast(`${matched} photo(s) matched to deities, ${added} added as new slides`);
  show(idx, 1);
};

/* Keyboard */
document.addEventListener('keydown', e=>{
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key.toLowerCase() === 'f') toggleFull();
  else if (e.key.toLowerCase() === 'm') toggleMirror();
  poke();
});

/* Swipe on mobile */
let sx = null;
stage.addEventListener('touchstart', e=>{ sx = e.touches[0].clientX; poke(); }, {passive:true});
stage.addEventListener('touchend', e=>{
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) (dx < 0 ? next : prev)(); sx = null;
});

/* Hide controls & cursor when idle */
let idleT;
function poke(){ document.body.classList.remove('idle','hide-cursor'); clearTimeout(idleT);
  idleT = setTimeout(()=>document.body.classList.add('idle','hide-cursor'), 3500); }
['mousemove','click','touchstart'].forEach(ev=>document.addEventListener(ev, poke, {passive:true}));

/* Start */
fill(cur, slides[0]); cur.className = 'slide active';
renderDots(); schedule(); poke(); wake();
</script>
</body>
</html>
